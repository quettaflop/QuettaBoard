name: Website build checks

on:
  push:
    branches: [main, kev/portfolio-redesign]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser for site checks
        run: npx playwright install --with-deps chromium

      # Builds the marketing site to the root of dist-web/ and the PUBLIC
      # dashboard to dist-web/board/. Production is published separately
      # from quettaflop/quettaflop.github.io through GitHub Pages.
      # build:web runs scripts/check-site-bundle.mjs itself; the explicit step
      # below re-runs it so a failure is legible as its own red check rather
      # than buried in build output.
      - run: npm run build:web
      - name: Verify bundle boundaries
        run: node scripts/check-site-bundle.mjs dist-web
